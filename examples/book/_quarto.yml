project:
  type: book
  pre-render: _setup.R

book:
  title: "quartoReactive"
  subtitle: "Gemeenten vergelijken in een Quarto-boek"
  author: "Pieter Seinen"
  site-url: https://pieterseinen.github.io/quartoReactive/
  repo-url: https://github.com/pieterseinen/quartoReactive
  repo-subdir: examples/book
  repo-actions: [source, issue]
  chapters:
    - index.qmd
    - part: "Voorbeeld: Hart voor Brabant"
      chapters:
        - bevolking.qmd
        - inkomen.qmd
        - gezondheid.qmd
    - part: "Handleiding"
      chapters:
        - aan-de-slag.qmd
        - invoer.qmd
        - kaart.qmd
        - grafieken-en-tabellen.qmd
        - eigen-widgets.qmd
        - losse-documenten.qmd
        - hoe-het-werkt.qmd

lang: nl

execute:
  echo: true
  warning: false

format:
  html:
    code-fold: true
    code-summary: "Toon code"
    include-in-header: _qr-header.html
    include-after-body: _qr-sidebar.html
